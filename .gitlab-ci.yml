default:
  before_script:
    - env
    - echo "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USER}" --password-stdin

.retry-and-timeout: &retry-and-timeout
  retry:
    max: 2
    when:
      - job_execution_timeout
      - stuck_or_timeout_failure
      - api_failure
      - runner_system_failure
      - script_failure
      - unknown_failure
  timeout: 120 minutes

stages:
  - build

Pegasus Docker Build Images:
  <<: *retry-and-timeout
  stage: build
  parallel:
    matrix:
      - TAG:
          - alpine_3
          - suse_15
          - deb_11
          - deb_12
          - deb_13
          - rhel_8
          - rhel_9
          - rhel_10
          - ubuntu_22
          - ubuntu_24
          - ubuntu_26
  script:
    - cd ${TAG}
    - docker buildx build --builder multiarch-builder --platform linux/amd64,linux/arm64 --tag pegasus/buildenv:${TAG} --progress plain --push .
  tags:
    - docker-cli
    - docker-multiarch
  rules:
    - changes:
        paths:
          - ${TAG}/**/*

Other Images:
  <<: *retry-and-timeout
  stage: build
  parallel:
    matrix:
      - REPO:
          - claude-runner
        DIR: claude-runner
      - REPO:
          - devcontainer
        DIR: devcontainer
  script:
    - cd ${DIR}
    - docker buildx build --builder multiarch-builder --platform linux/amd64,linux/arm64 --tag pegasus/${REPO} --progress plain --push .
  tags:
    - docker-cli
    - docker-multiarch
  rules:
    - changes:
        paths:
          - ${DIR}/**/*
